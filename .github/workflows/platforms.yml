# Portability and toolchain drift — deliberately NOT part of the merge gate.
#
# The product of this repository is a Linux binary: the downstream projects build it with
# `make -C src havilah` inside a Debian image. Windows and macOS builds exist to keep
# contributions to Atlantis-PBEM/Atlantis honest and to keep local development on a Mac
# working. A regression there is worth a day's delay; it is not worth seven minutes on
# every pull request, which is what the Windows compile cost in the previous pipeline.
#
# The runner images here are intentionally UNPINNED, the opposite of ci.yml. The gate must
# be reproducible, so it pins. This workflow exists precisely to find out early when a new
# image ships a compiler whose new warnings break -Werror without any change on our side —
# so it must track whatever "latest" currently means. When it goes red, pin the gate's
# image or fix the warning, then let the gate follow.
name: Platforms

on:
  push:
    branches: [master]
  schedule:
    # Mondays 05:00 UTC. Catches image and compiler drift between merges.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the state of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `make all` builds all six rulesets and the unit test binary. Compiling is the
      # entire point here: -Werror turns any new compiler diagnostic into a failure, which
      # is the signal this workflow is for.
      #
      # The tests themselves are not run: the engine's behaviour is platform-independent
      # and is covered on Linux by the CI gate, while the snapshot suite is Linux-only by
      # construction. Running the unit tests here would also mean working around MinGW
      # appending .exe to the output name, for no added signal.
      - name: Build all rulesets and the unit tests
        run: make all
