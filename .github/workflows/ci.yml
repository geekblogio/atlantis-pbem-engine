# The merge gate.
#
# Branch protection on master requires exactly one status check, `CI`, produced by the
# aggregating `gate` job at the bottom of this file. Every other job may be added,
# renamed or split without touching the protection settings. Two consequences:
#
#   * Do not rename or remove the `gate` job. A required context that no run reports
#     leaves every pull request permanently pending.
#   * There is deliberately no workflow-level `paths:` filter, for the same reason: a
#     documentation-only pull request must still produce the `CI` context. Filtering
#     happens in the `changes` job and per-job `if:` conditions, so skipped jobs still
#     report a result, and the gate treats `skipped` as passing.
name: CI

on:
  pull_request:
  push:
    # Also on master so ccache entries are written to the base branch. Action caches are
    # branch-scoped: a pull request can read its base branch's cache but not another
    # pull request's, so without this the cache would never be warm.
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      viewer: ${{ steps.filter.outputs.viewer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - '**/*.cpp'
              - '**/*.h'
              - '**/*.hpp'
              - 'Makefile'
              - 'CMakeLists.txt'
              - '*.cmake'
              - 'external/**'
              - 'snapshot-tests/**'
              - 's/**'
              - '**/*_intro.html'
              - '**/html/*.css'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
            viewer:
              - 'map_viewer/**'

  cmake:
    name: Build & Test (cmake)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ccache-cmake-ubuntu-24.04
          max-size: 500M

      # CMake generates correct dependencies, so -j is safe here. It is NOT safe for the
      # hand-written Makefile, where all six rulesets share a single obj/ directory and
      # `mkdir obj` races the compiles.
      #
      # RelWithDebInfo, not Debug: this job runs the snapshot suite, and the binary it tests
      # should be built the way the shipped one is (-O2 -g).
      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # The snapshot runners fall back to ../build/<game>, so they replay against what was
      # just built. No artifact round-trip, and therefore no exec bit to restore.
      #
      # Linux only, by design: the fixtures are byte-compared against the output of a Linux
      # binary, and the Windows CRT would write CRLF into every one of them.
      - name: Snapshot tests
        working-directory: snapshot-tests
        run: ./run-snapshots.sh

  make:
    name: Build (make)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ccache-make-ubuntu-24.04
          max-size: 500M

      # This is the path the downstream Docker image uses (`make -C src havilah`), and the
      # only one that exercises the Makefile's own flags. Without it, adding a source file
      # to CMakeLists.txt but not to the Makefile would go unnoticed until the image build.
      # No -j, see the cmake job above.
      - name: Build havilah and the unit tests
        run: make CPLUS="ccache g++" havilah unittest

      - name: Unit tests
        working-directory: unittest
        run: ./unittest

  viewer:
    name: Map Viewer
    needs: changes
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Exists so that a Dependabot bump of the viewer's dependencies arrives with some
      # verification rather than none. Type checking is the only signal available today:
      # `parcel build` currently fails under Yarn 4's PnP linker with
      # "@parcel/reporter-dev-server ... defined here, but not installed", which is a
      # packaging problem of its own and not something a CI job should paper over.
      - name: Install
        working-directory: map_viewer
        run: corepack enable && yarn install --immutable

      - name: Type check
        working-directory: map_viewer
        run: yarn typecheck

  hygiene:
    name: Upstream Hygiene
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'upstream/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Branches named upstream/* are candidates for contribution to
      # Atlantis-PBEM/Atlantis. They must not carry anything specific to this fork,
      # because that content would leak into an upstream pull request. A checklist does
      # not survive a late evening; this does.
      #
      # `.claude/` is on the list because it holds the guard that keeps agents from
      # writing to upstream at all. Letting that leak into an upstream pull request
      # would be the most embarrassing possible way for it to travel.
      - name: Reject fork-local paths on an upstream/* branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=50 origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "Changed files:"
          echo "$changed"
          offending=$(echo "$changed" | grep -E '^(CLAUDE\.md|CONTRIBUTING\.md|README\.md|docs/fork/|docs/decisions/|\.github/|\.claude/)' || true)
          if [ -n "$offending" ]; then
            echo "::error::Fork-local paths must not appear on an upstream/* branch:"
            echo "$offending"
            exit 1
          fi
          echo "No fork-local paths touched."

  register:
    name: Divergence Register
    # Only a pull request has a number to register with, and only master accumulates
    # divergence. Two exemptions, both structural rather than convenience:
    #
    #   * upstream/* branches are rebase-merged, so their commits keep no (#N) marker
    #     and are registered by short SHA afterwards. The Upstream Hygiene job would
    #     reject the docs/fork/ edit anyway.
    #   * Bot-authored pull requests (Dependabot, the vendored-header refresh) cannot
    #     write a register entry. They are registered by SHA afterwards too.
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'master' &&
      !startsWith(github.head_ref, 'upstream/') &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The other half of the rule in docs/fork/patches.md. That check runs over merged
      # history and can only report a gap once it exists; this one refuses to let the gap
      # be created, which is the point at which fixing it is still free.
      - name: Require an entry naming this pull request
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if grep -qE "#${PR}([^0-9]|$)" docs/fork/patches.md; then
            echo "Pull request #${PR} is registered."
            exit 0
          fi
          echo "::error file=docs/fork/patches.md::No entry names #${PR}. Every commit that lands on master is a divergence from upstream and must be registered -- add the entry to docs/fork/patches.md on this branch."
          exit 1

  # The single required status check.
  #
  # `if: always()` so it reports even when a job it needs was skipped. `skipped` is
  # tolerated; `failure` and `cancelled` are not. Checking the results explicitly rather
  # than relying on `if: success()` matters: that would pass when a need was skipped and
  # would also let a genuine failure through in some skip combinations.
  draworder:
    name: RNG Draw Order
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two RNG draws in one argument list are evaluated in an order C++ leaves unspecified, and
      # GCC picks a different one per architecture -- which is how one seed built two different
      # worlds. The snapshot suite cannot see this: it replays recorded turns on one architecture,
      # and world generation is outside it entirely. See docs/decisions/0017.
      - name: Refuse unsequenced RNG draws
        run: python3 scripts/check-rng-draw-order.py .

  gate:
    name: CI
    if: always()
    needs: [changes, cmake, make, viewer, hygiene, register, draworder]
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate job results
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs.*.result) }}' | grep -qE '"(failure|cancelled)"'; then
            echo "::error::At least one job failed or was cancelled."
            exit 1
          fi
          echo "All jobs succeeded or were skipped."
